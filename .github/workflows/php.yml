name: PHP Composer

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions: [ '8.4', '8.5' ]
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
    services:
      pgsql:
        image: postgres:14.1-alpine
        env:
          POSTGRES_USER: yii2_message_delivery
          POSTGRES_PASSWORD: yii2_message_delivery
        ports:
          - 5510:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: pgsql, pdo_pgsql
          coverage: xdebug

      - name: Check PHP Version
        run: |
          php -v
          composer --version

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}-
      - name: Install dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress

      - name: Run PHPCS linter
        run: composer run-script lint

      - name: Run PHPUnit tests on Postgres
        run: composer run-script test-pgsql

      - name: Run PHPUnit tests on Postgres with coverage
        run: composer run-script cover

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
